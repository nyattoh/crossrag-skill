<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
<title id="title">CrossRAG: one corpus, four retrieval routes, a separate writer</title>
<desc id="desc">Two or more ordered context concepts and a corpus of concept pairs with motif text share one encoder. The default is offline signed character n-gram hashing, not semantic embeddings; multilingual E5 via SentenceTransformer is optional. Four alternative ranking methods are similarity to the mean context vector, projection residual from the context span with blended weights, oriented bivector cosine with blended weights, and deterministic hash ranking as a control. Geometric drawings are schematic: oriented planes in higher dimensions do not define a unique three-dimensional normal. The selected method returns JSON motifs and scores. A separate host LLM writes creative prose or unverified hypotheses. These heuristic rankings do not establish improved creativity or discovery and retrieved motifs are not factual evidence.</desc>
