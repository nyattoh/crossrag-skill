<text x="62" y="237" font-size="16" fill="#d5e4eb" font-weight="400" text-anchor="start">2+ anchors; first two orient the wedge</text>
<text x="62" y="273" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start">+ Corpus: concept pair + motif text</text>
