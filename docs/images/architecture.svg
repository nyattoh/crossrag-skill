<text x="40" y="87" font-size="34" fill="#172a3a" font-weight="700" text-anchor="start">One corpus. Four ways to find a motif.</text>
<text x="40" y="120" font-size="18" fill="#506374" font-weight="400" text-anchor="start">Local numerical retrieval supplies material; the receiving model writes the text.</text>
