<text x="699" y="952" font-size="23" fill="#ffffff" font-weight="700" text-anchor="start">Writes from retrieved material</text>
<text x="699" y="982" font-size="17" fill="#d5e4eb" font-weight="400" text-anchor="start">Creative prose or unverified hypotheses</text>
<text x="699" y="1011" font-size="16" fill="#d5e4eb" font-weight="400" text-anchor="start">Retrieval itself does not generate prose</text>
<text x="40" y="1072" font-size="13" fill="#506374" font-weight="400" text-anchor="start">Geometry is schematic. Swapping the first two anchors flips the wedge component, not necessarily the blended ranking.</text>
<text x="40" y="1098" font-size="15" fill="#172a3a" font-weight="700" text-anchor="start">Heuristic ranks ≠ proven creativity or discovery benefits. Motifs are inspiration, not verified factual evidence.</text>
<text x="40" y="1130" font-size="13" fill="#506374" font-weight="400" text-anchor="start">Reference prototype · main 93396d8f · HashEncoder is not a semantic embedding model</text>
